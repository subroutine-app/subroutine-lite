[workspace]
members = [
    "crates/auth",
    "crates/core",
    "crates/parser",
    "crates/local-store",
    "crates/server",
    "crates/desktop",
]
exclude = ["crates/integration"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
subroutine-auth = { path = "crates/auth" }
oauth2 = { version = "5.0", default-features = false }
jsonwebtoken = "9.3"
subtle = "2.6"
url = "2.5"
anyhow = "1.0.100"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1.20.0", features = ["v4", "v5", "v7", "serde"] }
flume = "0.11"
clap = { version = "4.5.30", features = ["derive"] }
logos = "0.15"
axum = "0.8.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
chronoutil = "0.2.7"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5.3.3"
notify = "7.0.0"
notify-rust = "4"
