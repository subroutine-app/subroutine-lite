[package]
name = "server"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "subroutine-lite-server"
path = "src/main.rs"

[dependencies]
subroutine-auth = { workspace = true, features = ["server"] }
subroutine-core = { package = "core", path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
chronoutil = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"


sha2 = "0.10"



url = "2.5"

